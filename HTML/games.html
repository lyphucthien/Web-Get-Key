<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supported games – LPT Hub</title>
<meta name="description" content="The games LPT Hub supports and the features of each. Search and view details for every game.">
<link rel="canonical" href="https://lyphucthien.vercel.app/games">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dkui88bcf/image/upload/v1786939501/Logo_LPT_vnq390.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LPT Hub">
<meta property="og:title" content="Supported games – LPT Hub">
<meta property="og:description" content="The games LPT Hub supports and the features of each. Search and view details for every game.">
<meta property="og:url" content="https://lyphucthien.vercel.app/games">
<meta property="og:image" content="https://res.cloudinary.com/dkui88bcf/image/upload/v1786939501/Logo_LPT_vnq390.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/CSS/style.css">
<link rel="stylesheet" href="/CSS/games.css">
<script>document.documentElement.classList.add("js")</script>
<style>.js .gl-ssr{display:none}</style>
<noscript><style>#msg{display:none}</style></noscript>
<style>html.lang-pending body{visibility:hidden}</style>
<script>try{if(!localStorage.getItem("lpt_lang")&&!sessionStorage.getItem("lpt_lang_geo")){document.documentElement.classList.add("lang-pending");setTimeout(function(){document.documentElement.classList.remove("lang-pending")},2500)}}catch(e){}</script>
</head>
<body data-page="games">

<main>
  <div class="wrap gl-page">
    <div class="gl-head">
      <h1>Supported games</h1>
      <p>Click a game to see its features in detail.</p>
    </div>

    <div class="gl-toolbar">
      <label class="gl-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search games..." autocomplete="off" aria-label="Search games">
      </label>
      <div class="gl-count"><b id="totalNum">0</b> supported</div>
    </div>

    <div class="gl-msg" id="msg">Loading games...</div>
    <div class="gl-grid" id="grid"></div>
    <!--GAMES_SSR-->
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 LPT Hub</span>
    <nav aria-label="Footer links">
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/privacy">Privacy</a>
      <a href="/docs">Docs</a>
    </nav>
  </div>
</footer>

<dialog class="gl-dialog" id="dialog" aria-labelledby="dName">
  <button type="button" class="gl-close" id="dClose" aria-label="Close">&times;</button>
  <div class="gl-d-img" id="dImg"></div>
  <div class="gl-d-body">
    <span class="tag" id="dTag"></span>
    <h2 id="dName"></h2>
    <p class="gl-d-desc" id="dDesc"></p>
    <div class="gl-d-feat" id="dFeat"></div>
    <a class="gl-d-btn" id="dBtn" href="/get-key" hidden>Get a key for this game</a>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const grid = $("grid"), msg = $("msg"), search = $("search"), totalNum = $("totalNum"), dialog = $("dialog");
let GAMES = [];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d")
  .toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();

function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}

function cover(g, parent) {
  parent.append(el("div", "gl-initial", (g.name[0] || "?").toUpperCase()));
  if (!g.image) return;
  const img = document.createElement("img");
  img.alt = g.name; img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
  img.addEventListener("error", () => img.remove());
  img.src = g.image;
  parent.append(img);
}

function renderCard(g) {
  const card = el("button", "gl-card"); card.type = "button";
  const thumb = el("div", "gl-thumb");
  cover(g, thumb);
  thumb.append(el("span", "gl-badge" + (g.status === "on" ? " on" : ""), g.status === "on" ? "Supported" : "Coming soon"));
  card.append(thumb, el("div", "gl-name", g.name));
  card.addEventListener("click", () => openGame(g));
  const name = norm(g.name);
  card._c = {
    name, compact: name.replace(/ /g, ""), words: name.split(" ").filter(Boolean),
    feat: norm(g.features.map(grp => grp.category + " " + grp.items.join(" ")).join(" "))
  };
  return card;
}

function openGame(g) {
  const dImg = $("dImg"); dImg.replaceChildren(); cover(g, dImg);
  const tag = $("dTag"); tag.className = "tag" + (g.status === "on" ? " on" : ""); tag.textContent = g.status === "on" ? "Supported" : "Coming soon";
  $("dName").textContent = g.name;
  $("dDesc").textContent = g.description || "No description yet.";

  const total = g.features.reduce((n, grp) => n + grp.items.length, 0);
  const feat = $("dFeat"); feat.replaceChildren();
  const head = el("div", "gl-d-head"); head.append(el("span", "", "Features"), el("span", "", String(total)));
  feat.append(head);
  if (!total) feat.append(el("p", "gl-empty", "No feature list yet."));
  g.features.forEach(grp => {
    if (grp.category) feat.append(el("div", "gl-cat", grp.category));
    const ul = el("ul", "gl-list");
    grp.items.forEach(item => ul.append(el("li", "", item)));
    feat.append(ul);
  });

  const btn = $("dBtn");
  btn.hidden = g.status !== "on";

  dialog.showModal();
  dialog.querySelector(".gl-d-body").scrollTop = 0;
}

$("dClose").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

function tokenScore(tok, c) {
  if (c.name.includes(tok)) return c.words.some(w => w.startsWith(tok)) ? 4 : 3;
  if (tok.length >= 4) {
    const lim = tok.length >= 8 ? 2 : 1;
    if (c.words.some(w => Math.abs(w.length - tok.length) <= lim && lev(w, tok) <= lim)) return 2;
  }
  if (c.feat.includes(tok)) return 1;
  return 0;
}

function applyFilter() {
  const q = norm(search.value);
  const scored = [...grid.children].map(card => {
    if (!q) return { card, score: 1 };
    const c = card._c, tokens = q.split(" ");
    const qc = q.replace(/ /g, "");
    if (qc.length >= 2 && c.compact.includes(qc)) return { card, score: 10 };
    let score = 0;
    for (const t of tokens) { const sc = tokenScore(t, c); if (!sc) { score = 0; break; } score += sc; }
    return { card, score };
  });
  scored.forEach(x => { x.card.hidden = x.score === 0; });
  const shown = scored.filter(x => x.score > 0);
  msg.hidden = shown.length > 0;
  if (!shown.length) msg.textContent = "No games found.";
}
search.addEventListener("input", applyFilter);

async function loadGames() {
  try {
    const res = await fetch("/api/games", { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    GAMES = Array.isArray(data.games) ? data.games : [];
    totalNum.textContent = GAMES.filter(g => g.status === "on").length;
    if (!GAMES.length) { msg.textContent = "No games yet."; return; }
    msg.hidden = true;
    grid.replaceChildren(...GAMES.map(renderCard));
  } catch (e) {
    console.error("Load games error:", e);
    msg.textContent = "Could not load the games list. Please try again later.";
  }
}
loadGames();
</script>
<script src="/JS/layout.js"></script>
<script src="/JS/i18n.js"></script>
</body>
</html>
